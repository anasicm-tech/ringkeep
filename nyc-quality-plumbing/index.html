  /* NAV */
  nav {

  }
  .nav-logo .logo-icon {
    width: 40px; height: 40px; background: linear-gradient(135deg, #1e90ff, #00c6ff);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;

  .nav-logo span {

    color: #fff; padding: 10px 22px; border-radius: 30px;
    font-weight: 600; font-size: 0.9rem;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .nav-cta:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(30,144,255,0.4); }

  }
  .hero::before {
    content: '';

    background: radial-gradient(circle at 30% 50%, rgba(30,144,255,0.15) 0%, transparent 50%),

    font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    margin-bottom: 20px;

    box-shadow: 0 8px 30px rgba(30,144,255,0.4);

  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(30,144,255,0.5); }
  .btn-secondary {
    background: transparent; color: #fff;

    font-size: 1.05rem; font-weight: 600;

  }
  .btn-secondary:hover { border-color: #00c6ff; background: rgba(0,198,255,0.1); }
  .hero-stats {
