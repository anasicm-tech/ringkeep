<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYC Quality Plumbing | Professional Plumber in New York</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Segoe UI', Arial, sans-serif; color: #1a1a2e; background: #fff; }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
    background: rgba(10, 25, 60, 0.97);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 5%; height: 68px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .nav-logo .icon {
    width: 38px; height: 38px; background: #1e88e5;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .nav-logo .icon svg { width: 20px; height: 20px; fill: #fff; }
  .nav-logo span { color: #fff; font-size: 1.15rem; font-weight: 700; letter-spacing: 0.3px; }
  .nav-links { display: flex; gap: 28px; list-style: none; }
  .nav-links a { color: #cdd8ee; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.2s; }
  .nav-links a:hover { color: #63b3ff; }
  .nav-cta {
    background: #1e88e5; color: #fff; padding: 10px 22px;
    border-radius: 25px; text-decoration: none; font-weight: 700; font-size: 0.9rem;
    transition: background 0.2s, transform 0.15s;
  }
  .nav-cta:hover { background: #1565c0; transform: scale(1.04); }
  @media(max-width:768px){
    .nav-links { display: none; }
    .nav-logo span { font-size: 1rem; }
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    background: linear-gradient(135deg, #0a193c 0%, #0d2a60 55%, #1565c0 100%);
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 100px 20px 60px;
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; top: -60px; right: -80px;
    width: 420px; height: 420px; border-radius: 50%;
    background: rgba(30,136,229,0.12); pointer-events: none;
  }
  .hero::after {
    content: ''; position: absolute; bottom: -80px; left: -60px;
    width: 320px; height: 320px; border-radius: 50%;
    background: rgba(99,179,255,0.08); pointer-events: none;
  }
  .hero-content { max-width: 760px; position: relative; z-index: 1; }
  .hero-badge {
    display: inline-block; background: rgba(30,136,229,0.25);
    border: 1px solid rgba(99,179,255,0.4);
    color: #90caff; padding: 6px 18px; border-radius: 20px;
    font-size: 0.82rem; font-weight: 600; letter-spacing: 1.2px;
    text-transform: uppercase; margin-bottom: 22px;
  }
  .hero h1 {
    font-size: clamp(2.2rem, 5.5vw, 3.6rem);
    font-weight: 800; color: #fff; line-height: 1.18;
    margin-bottom: 20px; letter-spacing: -0.5px;
  }
  .hero h1 span { color: #63b3ff; }
  .hero p {
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    color: #a8c0e8; line-height: 1.7; max-width: 580px;
    margin: 0 auto 36px;
  }
  .hero-btns { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .btn-primary {
    background: #1e88e5; color: #fff; padding: 15px 34px;
    border-radius: 30px; text-decoration: none; font-weight: 700; font-size: 1rem;
    box-shadow: 0 4px 22px rgba(30,136,229,0.45);
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
  }
  .btn-primary:hover { background: #1565c0; transform: translateY(-2px); box-shadow: 0 8px 28px rgba(30,136,229,0.55); }
  .btn-secondary {
    background: transparent; color: #fff; padding: 15px 34px;
    border-radius: 30px; text-decoration: none; font-weight: 700; font-size: 1rem;
    border: 2px solid rgba(255,255,255,0.35);
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.08); border-color: #fff; transform: translateY(-2px); }
  .hero-stats {
    display: flex; gap: 36px; justify-content: center; flex-wrap: wrap;
    margin-top: 56px; padding-top: 40px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .stat { text-align: center; }
  .stat-num { font-size: 2rem; font-weight: 800; color: #fff; line-height: 1; }
  .stat-label { font-size: 0.82rem; color: #7da8d8; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.8px; }

  /* WAVE */
  .wave-divider { display: block; line-height: 0; background: #f0f5ff; }
  .wave-divider svg { display: block; width: 100%; }

  /* SERVICES */
  .services { background: #f0f5ff; padding: 90px 5%; }
  .section-tag {
    text-align: center; font-size: 0.8rem; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; color: #1e88e5;
    margin-bottom: 10px;
  }

    text-align: center; font-size: clamp(1.7rem, 4vw, 2.5rem);
    font-weight: 800; color: #0a193c; margin-bottom: 14px;
